name: Equis checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  software:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      EQUIS_ENV_FILE: ''
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
      ANONYMIZED_TELEMETRY: 'False'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: agent/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install CPU inference dependencies
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Check publishable source
        run: python -B scripts/check_release.py
      - name: Run offline maintenance gate
        working-directory: agent
        run: python -B scripts/precommit.py
  firmware:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - run: python -m pip install platformio==6.1.19
      - run: python -m platformio run --project-dir esp32_sensors
